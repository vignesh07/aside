appId: com.vignesh.aside
productName: Aside
copyright: Copyright © 2026 Vignesh Natarajan

directories:
  output: release
  buildResources: assets

# electron-updater reads this fixed generic feed from app-update.yml inside the
# signed bundle. Railway serves latest-mac.yml plus immutable ZIP artifacts;
# DMGs remain the manual recovery/install path.
publish:
  provider: generic
  url: https://aside-production-fd82.up.railway.app/updates
  channel: latest
  # Railway fronts an S3-compatible bucket with signed redirects. Single-range
  # requests preserve differential ZIP downloads across that boundary.
  useMultipleRangeRequest: false

# Use the current multi-file metadata format so one feed can safely describe
# both Apple Silicon and Intel ZIPs.
electronUpdaterCompatibility: ">= 2.16"

# Remove Electron execution paths this app does not use. Together with ASAR
# integrity, this prevents environment variables or a loose app directory from
# substituting code before the signed bundle starts.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  loadBrowserProcessSpecificV8Snapshot: false
  grantFileProtocolExtraPrivileges: false

# Arch is pinned explicitly by the npm scripts rather than left to the host.
# `--dir` follows the host arch, and a toolchain running under Rosetta reports
# x86_64 on Apple Silicon — which silently produces an emulated x64 app on an
# arm64 machine. Always name the arch.

# The core is inlined into build/ by scripts/bundle.mjs, so nothing outside this
# package needs to ship.
files:
  - build/**
  - index.html
  - preload.cjs
  - assets/trayTemplate.png
  - assets/trayTemplate@2x.png
  - package.json
  - '!**/*.map'

# Notarization runs here, from a keychain profile — no credentials in this file
# or anywhere else in the repo. Skips itself (loudly) if the profile is absent.
afterSign: scripts/notarize.mjs

mac:
  icon: assets/icon.icns
  category: public.app-category.developer-tools
  darkModeSupport: true
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  extendInfo:
    # Menubar-only: no dock icon, no Cmd-Tab entry. This is the real mechanism —
    # app.dock.hide() only handles the dock, and only after launch.
    LSUIElement: true

  # The Developer ID Application cert — NOT "Apple Development", which is for
  # local runs only and which Gatekeeper rejects. electron-builder picks the
  # Developer ID cert for this target automatically, and rejects the
  # "Developer ID Application:" prefix, so the identity is the common name only.
  # The team id disambiguates it from the Apple Development cert (D4TW5GH3FN).
  identity: Vignesh Natarajan (8ZS766K9K4)

  # Required for notarization. It also blocks JIT — hence the entitlements below,
  # without which the app signs fine and then crashes instantly on launch.
  hardenedRuntime: true
  entitlements: entitlements.mac.plist
  entitlementsInherit: entitlements.mac.inherit.plist

  # We notarize in the afterSign hook (keychain profile) rather than letting
  # electron-builder do it from env vars.
  notarize: false

  # `spctl` assessment during build is unreliable before stapling; the real
  # verification happens after notarization (see `npm run verify:signing`).
  gatekeeperAssess: false

dmg:
  title: aside ${version}
  contents:
    - x: 140
      y: 180
      type: file
    - x: 400
      y: 180
      type: link
      path: /Applications
