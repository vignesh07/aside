<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'" />
    <title>aside</title>
    <style>
      :root {
        --bg: #1a1a22;
        --panel: #22222c;
        --border: #3a3a4a;
        --text: #e0e0e0;
        --dim: #8a8a9a;
        --accent: #4ecdc4;
        --you: #4ecdc4;
        --aside: #c084fc;
        --error: #ff6b6b;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border-bottom: 1px solid var(--border);
      }
      header .brand { font-weight: 600; color: var(--accent); }
      header select {
        margin-left: auto;
        background: var(--panel);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 3px 6px;
        max-width: 220px;
      }
      #messages { flex: 1; overflow-y: auto; padding: 10px; }
      .empty { color: var(--dim); }
      .turn { margin-bottom: 10px; }
      .turn .who { font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
      .turn.user .who { color: var(--you); }
      .turn.assistant .who { color: var(--aside); }
      .turn .body { white-space: pre-wrap; }
      .turn.error .body { color: var(--error); }
      .thinking { color: var(--error); font-style: italic; }
      footer { padding: 8px; border-top: 1px solid var(--border); }
      #composer { display: flex; gap: 6px; }
      #input {
        flex: 1;
        background: var(--panel);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 6px 8px;
      }
      #input:focus { outline: none; border-color: var(--accent); }
      #send {
        background: var(--accent);
        color: #10151a;
        border: none;
        border-radius: 6px;
        padding: 0 12px;
        font-weight: 600;
        cursor: pointer;
      }
      #send:disabled { opacity: .5; cursor: default; }
    </style>
  </head>
  <body>
    <header>
      <span class="brand">aside</span>
      <span class="dim" style="color: var(--dim)">read-only</span>
      <select id="sessions" title="focus a session for more detail"></select>
    </header>
    <div id="messages"></div>
    <footer>
      <form id="composer">
        <input id="input" placeholder="ask about your agents…" autocomplete="off" />
        <button id="send" type="submit">ask</button>
      </form>
    </footer>
    <script type="module" src="./build/renderer.js"></script>
  </body>
</html>
