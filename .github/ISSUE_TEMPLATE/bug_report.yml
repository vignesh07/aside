name: Bug report
description: Something in Aside is not working as expected
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this.

        **Please do not paste API keys, private transcripts, or other sensitive project details.** If this may be a security vulnerability, [report it privately](https://github.com/vignesh07/aside/security/advisories/new) instead.

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Tell us what you saw and where in Aside it happened.
      placeholder: I opened…
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: How can we reproduce it?
      description: A short sequence is enough. Remove anything private.
      placeholder: |
        1. Open…
        2. Click…
        3. See…
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: dropdown
    id: source
    attributes:
      label: Which agent was involved?
      options:
        - Not session-specific
        - Codex
        - Claude Code
        - Pi
        - More than one
    validations:
      required: true

  - type: input
    id: aside-version
    attributes:
      label: Aside version
      description: Find this in Aside Settings under Updates.
      placeholder: 0.1.10
    validations:
      required: true

  - type: input
    id: macos-version
    attributes:
      label: macOS version
      placeholder: macOS 15.5

  - type: textarea
    id: additional-context
    attributes:
      label: Anything else?
      description: Screenshots are useful if they contain no private information.

  - type: checkboxes
    id: privacy
    attributes:
      label: Public report
      options:
        - label: I removed secrets and any transcript or project details I do not want public.
          required: true
